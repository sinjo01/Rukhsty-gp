openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Rukhsty - Jordanian Digital Licensing Platform API
servers:
  - url: /api
tags:
  - name: health
  - name: auth
  - name: profile
  - name: services
  - name: licenseCategories
  - name: applications
  - name: documents
  - name: centers
  - name: appointments
  - name: training
  - name: medical
  - name: exams
  - name: licenses
  - name: vehicles
  - name: notifications
  - name: officer
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # PROFILE
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # SERVICES
  /services:
    get:
      operationId: listServices
      tags: [services]
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  # LICENSE CATEGORIES
  /license-categories:
    get:
      operationId: listLicenseCategories
      tags: [licenseCategories]
      responses:
        "200":
          description: License categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseCategory"

  # APPLICATIONS
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      responses:
        "200":
          description: User's applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationBody"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"

  /applications/{id}/submit:
    post:
      operationId: submitApplication
      tags: [applications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}/select-training-center:
    post:
      operationId: selectTrainingCenter
      tags: [applications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectCenterBody"
      responses:
        "200":
          description: Center selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  # DOCUMENTS
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocumentBody"
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  # CENTERS
  /centers:
    get:
      operationId: listCenters
      tags: [centers]
      parameters:
        - name: centerType
          in: query
          schema:
            type: string
        - name: governorate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Center"

  /centers/{id}:
    get:
      operationId: getCenter
      tags: [centers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Center detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Center"

  # APPOINTMENTS
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: bookAppointment
      tags: [appointments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAppointmentBody"
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}/cancel:
    post:
      operationId: cancelAppointment
      tags: [appointments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  # TRAINING
  /training/{applicationId}:
    get:
      operationId: getTrainingRecord
      tags: [training]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Training record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingRecord"

  # MEDICAL
  /medical/{applicationId}:
    get:
      operationId: getMedicalTest
      tags: [medical]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Medical test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalTest"

  # EXAMS
  /exams/{applicationId}:
    get:
      operationId: listExams
      tags: [exams]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exam"

  # LICENSES
  /licenses/my:
    get:
      operationId: getMyLicense
      tags: [licenses]
      responses:
        "200":
          description: My driving license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrivingLicense"

  # VEHICLES
  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: addVehicle
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVehicleBody"
      responses:
        "201":
          description: Vehicle added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllRead
      tags: [notifications]
      responses:
        "200":
          description: All read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # DASHBOARD
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [applications]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # OFFICER ENDPOINTS
  /officer/appointments:
    get:
      operationId: listOfficerAppointments
      tags: [officer]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Officer's center appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentWithUser"

  /officer/appointments/{id}/update:
    patch:
      operationId: updateAppointmentStatus
      tags: [officer]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentStatusBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /officer/training/{applicationId}/update:
    patch:
      operationId: updateTraining
      tags: [officer]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrainingBody"
      responses:
        "200":
          description: Training updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingRecord"

  /officer/medical/record:
    post:
      operationId: recordMedicalTest
      tags: [officer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordMedicalTestBody"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalTest"

  /officer/applications/search:
    get:
      operationId: searchOfficerApplications
      tags: [officer]
      parameters:
        - name: nationalId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching active applications for the officer stage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationWithUser"

  /officer/exams/record:
    post:
      operationId: recordExam
      tags: [officer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordExamBody"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"

  /officer/practical/record:
    post:
      operationId: recordPracticalExamChecklist
      tags: [officer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPracticalExamBody"
      responses:
        "201":
          description: Practical exam recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"

  /officer/dashboard:
    get:
      operationId: getOfficerDashboard
      tags: [officer]
      responses:
        "200":
          description: Officer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficerDashboard"

  # ADMIN ENDPOINTS
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: All applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApplications"

  /admin/applications/{id}/review:
    patch:
      operationId: adminReviewApplication
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReviewBody"
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /admin/applications/{id}/security/approve:
    post:
      operationId: approveSecurityReview
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Security review approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /admin/applications/{id}/security/reject:
    post:
      operationId: rejectSecurityReview
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rejectionReason:
                  type: string
              required: [rejectionReason]
      responses:
        "200":
          description: Security review rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /admin/applications/{id}/request-more-info:
    post:
      operationId: requestMoreInfo
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        "200":
          description: More information requested

  /security/applications/{id}/approve:
    post:
      operationId: securityOfficerApproveApplication
      tags: [security]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Security review approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /security/applications/{id}/reject:
    post:
      operationId: securityOfficerRejectApplication
      tags: [security]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rejectionReason:
                  type: string
              required: [rejectionReason]
      responses:
        "200":
          description: Security review rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /security/applications/{id}/request-more-info:
    post:
      operationId: securityOfficerRequestMoreInfo
      tags: [security]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                message:
                  type: string
      responses:
        "200":
          description: More information requested

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /admin/centers:
    get:
      operationId: listAdminCenters
      tags: [admin]
      responses:
        "200":
          description: Centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Center"
    post:
      operationId: createAdminCenter
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCenterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Center"

  /admin/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [admin]
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]

    # AUTH
    RegisterBody:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        secondName:
          type: string
        thirdName:
          type: string
        familyName:
          type: string
        age:
          type: integer
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE]
        nationalId:
          type: string
        phone:
          type: string
        governorate:
          type: string
        city:
          type: string
        area:
          type: string
        address:
          type: string
        personalPhotoUrl:
          type: string
        idFrontUrl:
          type: string
        idBackUrl:
          type: string
      required: [email, password, firstName, familyName, nationalId, phone, dateOfBirth, gender, governorate, address]

    LoginBody:
      type: object
      properties:
        identifier:
          type: string
        email:
          type: string
        password:
          type: string
      required: [password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserWithProfile"
      required: [token, user]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, TRAINING_CENTER_OFFICER, MEDICAL_CENTER_OFFICER, THEORY_EXAM_OFFICER, PRACTICAL_EXAM_OFFICER, DVLD_OFFICER, SECURITY_OFFICER]
        isEmailVerified:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
      required: [id, email, role, isEmailVerified, isActive, createdAt]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        firstName:
          type: string
        secondName:
          type: string
        thirdName:
          type: string
        familyName:
          type: string
        age:
          type: integer
        dateOfBirth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          nullable: true
        nationalId:
          type: string
        phone:
          type: string
          nullable: true
        governorate:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        personalPhotoUrl:
          type: string
          nullable: true
        idFrontUrl:
          type: string
          nullable: true
        idBackUrl:
          type: string
          nullable: true
        profileStatus:
          type: string
          enum: [INCOMPLETE, COMPLETE]
        createdAt:
          type: string
      required: [id, userId, firstName, secondName, thirdName, familyName, age, nationalId, profileStatus, createdAt]

    UserWithProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/UserProfile"
              nullable: true

    UpdateProfileBody:
      type: object
      properties:
        firstName:
          type: string
        secondName:
          type: string
        thirdName:
          type: string
        familyName:
          type: string
        phone:
          type: string
        governorate:
          type: string
        city:
          type: string
        area:
          type: string
        address:
          type: string
        personalPhotoUrl:
          type: string
        idFrontUrl:
          type: string
        idBackUrl:
          type: string

    # SERVICES
    Service:
      type: object
      properties:
        id:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
      required: [id, nameAr, nameEn, code, isActive]

    LicenseCategory:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        minimumAge:
          type: integer
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
      required: [id, code, nameAr, nameEn, minimumAge, isActive]

    # APPLICATIONS
    CreateApplicationBody:
      type: object
        properties:
          serviceId:
            type: string
          licenseCategoryId:
            type: string
            nullable: true
          governorate:
            type: string
          residenceArea:
            type: string
          trainingCertificate:
            type: object
            description: Required image document when creating a first-time driving license application.
            properties:
              fileUrl:
                type: string
              fileName:
                type: string
              mimeType:
                type: string
            required: [fileUrl, fileName, mimeType]
        required: [serviceId, governorate, residenceArea]

    Application:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        serviceId:
          type: string
          nullable: true
        licenseCategoryId:
          type: string
          nullable: true
        applicationNumber:
          type: string
        status:
          type: string
        currentStep:
          type: string
        governorate:
          type: string
          nullable: true
        residenceArea:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        submittedAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        service:
          $ref: "#/components/schemas/Service"
          nullable: true
        licenseCategory:
          $ref: "#/components/schemas/LicenseCategory"
          nullable: true
      required: [id, userId, applicationNumber, status, currentStep, createdAt, updatedAt]

    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationStep"
            documents:
              type: array
              items:
                $ref: "#/components/schemas/Document"
            appointments:
              type: array
              items:
                $ref: "#/components/schemas/Appointment"
            trainingRecord:
              $ref: "#/components/schemas/TrainingRecord"
              nullable: true
            medicalTest:
              $ref: "#/components/schemas/MedicalTest"
              nullable: true
            exams:
              type: array
              items:
                $ref: "#/components/schemas/Exam"

    ApplicationStep:
      type: object
      properties:
        id:
          type: string
        applicationId:
          type: string
        stepKey:
          type: string
        stepNameAr:
          type: string
        stepNameEn:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, COMPLETED, FAILED, SKIPPED]
        orderNumber:
          type: integer
        startedAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required: [id, applicationId, stepKey, stepNameAr, stepNameEn, status, orderNumber]

    SelectCenterBody:
      type: object
      properties:
        centerId:
          type: string
      required: [centerId]

    # DOCUMENTS
    UploadDocumentBody:
      type: object
      properties:
        applicationId:
          type: string
          nullable: true
        documentType:
          type: string
        fileUrl:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
      required: [documentType, fileUrl, fileName, mimeType]

    Document:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        applicationId:
          type: string
          nullable: true
        documentType:
          type: string
        fileUrl:
          type: string
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        verificationStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        rejectionReason:
          type: string
          nullable: true
        verifiedAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, userId, documentType, fileUrl, verificationStatus, createdAt]

    # CENTERS
    Center:
      type: object
      properties:
        id:
          type: string
        centerType:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
          nullable: true
        governorate:
          type: string
        city:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
      required: [id, centerType, nameAr, governorate, isActive, createdAt]

    CreateCenterBody:
      type: object
      properties:
        centerType:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        governorate:
          type: string
        city:
          type: string
        area:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
      required: [centerType, nameAr, governorate]

    # APPOINTMENTS
    BookAppointmentBody:
      type: object
      properties:
        applicationId:
          type: string
        centerId:
          type: string
        appointmentType:
          type: string
        appointmentDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        notes:
          type: string
      required: [applicationId, centerId, appointmentType, appointmentDate, startTime, endTime]

    Appointment:
      type: object
      properties:
        id:
          type: string
        applicationId:
          type: string
        userId:
          type: string
        centerId:
          type: string
          nullable: true
        appointmentType:
          type: string
        appointmentDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        queueNumber:
          type: integer
          nullable: true
        status:
          type: string
          enum: [BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW, FAILED, PASSED]
        notes:
          type: string
          nullable: true
        center:
          $ref: "#/components/schemas/Center"
          nullable: true
        createdAt:
          type: string
      required: [id, applicationId, userId, appointmentType, appointmentDate, startTime, endTime, status, createdAt]

    AppointmentWithUser:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/UserWithProfile"

    # TRAINING
    TrainingRecord:
      type: object
      properties:
        id:
          type: string
        applicationId:
          type: string
        centerId:
          type: string
          nullable: true
        theoreticalLessonsRequired:
          type: integer
        practicalLessonsRequired:
          type: integer
        theoreticalLessonsCompleted:
          type: integer
        practicalLessonsCompleted:
          type: integer
        status:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]
        startedAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
        instructorName:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        center:
          $ref: "#/components/schemas/Center"
          nullable: true
      required: [id, applicationId, theoreticalLessonsRequired, practicalLessonsRequired, theoreticalLessonsCompleted, practicalLessonsCompleted, status]

    UpdateTrainingBody:
      type: object
      properties:
        theoreticalLessonsCompleted:
          type: integer
        practicalLessonsCompleted:
          type: integer
        status:
          type: string
        instructorName:
          type: string
        notes:
          type: string

    # MEDICAL
    MedicalTest:
      type: object
      properties:
        id:
          type: string
        applicationId:
          type: string
        centerId:
          type: string
          nullable: true
        officerId:
          type: string
          nullable: true
        result:
          type: string
          enum: [DOES_NOT_NEED_GLASSES, NEEDS_GLASSES, NOT_FIT_TO_DRIVE, PASS_NO_GLASSES, PASS_WITH_GLASSES, FAILED_NOT_ALLOWED, NEEDS_RECHECK]
        leftEyeScore:
          type: string
          nullable: true
        rightEyeScore:
          type: string
          nullable: true
        requiresGlasses:
          type: boolean
        isAllowedToDrive:
          type: boolean
        notes:
          type: string
          nullable: true
        testedAt:
          type: string
      required: [id, applicationId, result, requiresGlasses, isAllowedToDrive, testedAt]

    RecordMedicalTestBody:
      type: object
      properties:
        applicationId:
          type: string
        result:
          type: string
          enum: [PASS_NO_GLASSES, PASS_WITH_GLASSES, FAILED_NOT_ALLOWED, NEEDS_RECHECK]
        leftEyeScore:
          type: string
        rightEyeScore:
          type: string
        requiresGlasses:
          type: boolean
        isAllowedToDrive:
          type: boolean
        notes:
          type: string
      required: [applicationId, result]

    # EXAMS
    Exam:
      type: object
      properties:
        id:
          type: string
        applicationId:
          type: string
        centerId:
          type: string
          nullable: true
        officerId:
          type: string
          nullable: true
        examType:
          type: string
          enum: [THEORY, PRACTICAL]
        score:
          type: string
          nullable: true
        maxScore:
          type: string
          nullable: true
        result:
          type: string
          enum: [PASSED, FAILED, ABSENT]
        attemptNumber:
          type: integer
        notes:
          type: string
          nullable: true
        examDate:
          type: string
      required: [id, applicationId, examType, result, attemptNumber, examDate]

    RecordExamBody:
      type: object
      properties:
        applicationId:
          type: string
        examType:
          type: string
          enum: [THEORY, PRACTICAL]
        score:
          type: number
        maxScore:
          type: number
        result:
          type: string
          enum: [PASSED, FAILED, ABSENT]
        notes:
          type: string
      required: [applicationId, examType, result]

    RecordPracticalExamBody:
      type: object
      properties:
        applicationId:
          type: string
        checklist:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              labelEn:
                type: string
              labelAr:
                type: string
              checked:
                type: boolean
            required: [key, checked]
        score:
          type: number
        result:
          type: string
          enum: [PASSED, FAILED]
        notes:
          type: string
      required: [applicationId, checklist]

    # LICENSES
    DrivingLicense:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        applicationId:
          type: string
          nullable: true
        licenseNumber:
          type: string
        nationalId:
          type: string
        fullNameAr:
          type: string
          nullable: true
        fullNameEn:
          type: string
          nullable: true
        licenseCategoryId:
          type: string
          nullable: true
        issueDate:
          type: string
        expiryDate:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, SUSPENDED, CANCELLED, RENEWED]
        photoUrl:
          type: string
          nullable: true
        qrCodeUrl:
          type: string
          nullable: true
        licenseCategory:
          $ref: "#/components/schemas/LicenseCategory"
          nullable: true
        createdAt:
          type: string
      required: [id, userId, licenseNumber, nationalId, issueDate, expiryDate, status, createdAt]

    # VEHICLES
    Vehicle:
      type: object
      properties:
        id:
          type: string
        ownerUserId:
          type: string
        plateNumber:
          type: string
        registrationNumber:
          type: string
          nullable: true
        vehicleType:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        manufactureYear:
          type: integer
          nullable: true
        color:
          type: string
          nullable: true
        currentLicenseExpiry:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, ownerUserId, plateNumber, createdAt]

    AddVehicleBody:
      type: object
      properties:
        plateNumber:
          type: string
        registrationNumber:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        manufactureYear:
          type: integer
        color:
          type: string
        currentLicenseExpiry:
          type: string
      required: [plateNumber]

    # NOTIFICATIONS
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
      required: [id, userId, title, message, type, isRead, createdAt]

    # DASHBOARD
    DashboardSummary:
      type: object
      properties:
        totalApplications:
          type: integer
        activeApplication:
          $ref: "#/components/schemas/Application"
          nullable: true
        upcomingAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        unreadNotifications:
          type: integer
        myLicense:
          $ref: "#/components/schemas/DrivingLicense"
          nullable: true
        profileCompletionPercent:
          type: integer
      required: [totalApplications, upcomingAppointments, unreadNotifications, profileCompletionPercent]

    # OFFICER
    OfficerDashboard:
      type: object
      properties:
        center:
          $ref: "#/components/schemas/Center"
          nullable: true
        todayAppointments:
          type: integer
        pendingAppointments:
          type: integer
        completedToday:
          type: integer
        recentAppointments:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentWithUser"
      required: [todayAppointments, pendingAppointments, completedToday, recentAppointments]

    UpdateAppointmentStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [CHECKED_IN, COMPLETED, NO_SHOW, FAILED, PASSED]
        notes:
          type: string
      required: [status]

    # ADMIN
    AdminStats:
      type: object
      properties:
        totalApplications:
          type: integer
        pendingReview:
          type: integer
        approvedToday:
          type: integer
        totalCitizens:
          type: integer
        totalCenters:
          type: integer
        applicationsByStatus:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        applicationsByGovernorate:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        passedExamsCount:
          type: integer
        failedExamsCount:
          type: integer
        pendingMedicalTests:
          type: integer
        licensesIssued:
          type: integer
      required: [totalApplications, pendingReview, approvedToday, totalCitizens, totalCenters, applicationsByStatus, applicationsByGovernorate, passedExamsCount, failedExamsCount, pendingMedicalTests, licensesIssued]

    CountByKey:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
      required: [key, count]

    PaginatedApplications:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationWithUser"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [applications, total, page, totalPages]

    ApplicationWithUser:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/UserWithProfile"

    AdminReviewBody:
      type: object
      properties:
        status:
          type: string
        rejectionReason:
          type: string
          nullable: true
      required: [status]

    PaginatedUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserWithProfile"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [users, total, page, totalPages]

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        description:
          type: string
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, type, description, createdAt]
