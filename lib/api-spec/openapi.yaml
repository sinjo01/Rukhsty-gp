        - bodyEn
        - isRead
        - createdAt

    # ─── DASHBOARD ────────────────────────────────────────────────────────────

    DashboardSummary:
      type: object
      properties:
        totalApplications:
          type: integer
        activeApplication:
          $ref: "#/components/schemas/Application"
          nullable: true
        upcomingAppointments:
          type: array
          items:
