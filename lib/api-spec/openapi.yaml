        id:
          type: string
        applicationId:
          type: string
        appointmentId:
          type: string
        citizenId:
          type: string
        testType:
          type: string
          enum: [vision, theory]
        outcome:
          type: string
          enum: [pass, fail, absent]
        score:
          type: integer
          nullable: true
        passingScore:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        testedAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - applicationId
        - appointmentId
        - citizenId
        - testType
        - outcome
        - testedAt
        - createdAt

