        - upcomingAppointments
        - unreadNotifications
        - recentActivity

    # ─── ADMIN ────────────────────────────────────────────────────────────────

    AdminStats:
      type: object
      properties:
        totalApplications:
          type: integer
        pendingReview:
          type: integer
        approvedToday:
          type: integer
        rejectedToday:
          type: integer
        totalCitizens:
          type: integer
        totalCenters:
          type: integer
        applicationsByStatus:
          type: array
          items:
